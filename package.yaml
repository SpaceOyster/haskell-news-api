author: Author name here

copyright: 2022 Author name here

dependencies:
  - base >= 4.7 && < 5
  - warp
  - wai
  - servant
  - servant-server
  - bytestring
  - text
  - time
  - containers
  - beam-core
  - beam-postgres
  - case-insensitive
  - aeson
  - mtl
  - exceptions
  - configurator
  - cryptonite
  - random
  - parsec
  - http-types
  - servant-docs
  - servant-multipart
  - postgresql-simple
  - postgresql-migration

description: Please see the README on GitHub at <https://github.com/githubuser/haskell-news-api#readme>

executables:
  haskell-news-api-exe:
    dependencies:
      - haskell-news-api
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    main: Main.hs
    source-dirs: app

extra-source-files:
  - README.md
  - ChangeLog.md

github: githubuser/haskell-news-api

library:
  source-dirs: src

license: BSD3

maintainer: example@example.com

name: haskell-news-api

tests:
  haskell-news-api-test:
    dependencies:
      - haskell-news-api
      - hspec
      - QuickCheck
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    main: Spec.hs
    source-dirs: test

version: 0.1.0.0
